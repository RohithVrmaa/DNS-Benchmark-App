name: Release DNS SpeedBench v1.0 Portable Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable-windows:
    name: Build 64-bit and 32-bit Portable Windows Executables
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application Bundle
        run: npm run build

      - name: Setup .NET Compiler for Native Standalone Binaries
        shell: pwsh
        run: |
          Write-Host "Locating Microsoft .NET Framework C# Compilers..."
          $csc64 = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $csc32 = "C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          Write-Host "CSC 64-bit: $csc64 (Exists: $(Test-Path $csc64))"
          Write-Host "CSC 32-bit: $csc32 (Exists: $(Test-Path $csc32))"

      - name: Generate C# Standalone Engine Source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-dist
          node -e "
            const fs = require('fs');
            const code = \`// DNS SpeedBench v1.0 by Rohith Varma - Standalone Windows Executable (.exe)
using System;
using System.Net.NetworkInformation;
using System.Diagnostics;
using System.Collections.Generic;

class DNSBenchmark
{
    struct Resolver {
        public string Name;
        public string IP;
        public string SecondaryIP;
    }

    static void Main()
    {
        Console.Title = \"DNS SpeedBench v1.0 - by Rohith Varma\";
        Console.ForegroundColor = ConsoleColor.Cyan;
        Console.WriteLine(\"==================================================================\");
        Console.WriteLine(\"   DNS SpeedBench v1.0 - Standalone Windows Executable (.exe)\");
        Console.WriteLine(\"   Author: Rohith Varma | Zero Installation Required\");
        Console.WriteLine(\"   Architecture: \" + (IntPtr.Size == 8 ? \"64-bit (x64)\" : \"32-bit (x86)\"));
        Console.WriteLine(\"==================================================================\");
        Console.ResetColor();
        Console.WriteLine();

        var resolvers = new List<Resolver>
        {
            new Resolver { Name = \"Cloudflare (1.1.1.1)\", IP = \"1.1.1.1\", SecondaryIP = \"1.0.0.1\" },
            new Resolver { Name = \"Google Public DNS\",   IP = \"8.8.8.8\", SecondaryIP = \"8.8.4.4\" },
            new Resolver { Name = \"Quad9 Security\",      IP = \"9.9.9.9\", SecondaryIP = \"149.112.112.112\" },
            new Resolver { Name = \"Cisco OpenDNS\",       IP = \"208.67.222.222\", SecondaryIP = \"208.67.220.220\" },
            new Resolver { Name = \"AdGuard Ad-Block\",    IP = \"94.140.14.14\", SecondaryIP = \"94.140.15.15\" },
            new Resolver { Name = \"NextDNS Anycast\",     IP = \"45.90.28.0\", SecondaryIP = \"45.90.30.0\" },
            new Resolver { Name = \"Control D\",           IP = \"76.76.2.0\", SecondaryIP = \"76.76.10.0\" }
        };

        Console.WriteLine(string.Format(\"{0,-24} {1,-16} {2,-12} {3}\", \"RESOLVER\", \"PRIMARY IP\", \"AVG LATENCY\", \"STATUS\"));
        Console.WriteLine(new string('-', 66));

        Ping pinger = new Ping();
        string fastestName = \"\";
        long lowestPing = long.MaxValue;
        string fastestIP = \"\";
        string fastestSecondary = \"\";

        foreach (var r in resolvers)
        {
            long totalTime = 0;
            int successfulPings = 0;

            for (int i = 0; i < 4; i++)
            {
                try
                {
                    PingReply reply = pinger.Send(r.IP, 1000);
                    if (reply.Status == IPStatus.Success)
                    {
                        totalTime += reply.RoundtripTime;
                        successfulPings++;
                    }
                }
                catch { }
            }

            if (successfulPings > 0)
            {
                long avg = totalTime / successfulPings;
                if (avg < lowestPing)
                {
                    lowestPing = avg;
                    fastestName = r.Name;
                    fastestIP = r.IP;
                    fastestSecondary = r.SecondaryIP;
                }

                Console.ForegroundColor = avg < 30 ? ConsoleColor.Green : (avg < 60 ? ConsoleColor.Yellow : ConsoleColor.Red);
                Console.WriteLine(string.Format(\"{0,-24} {1,-16} {2,-12} {3}\", r.Name, r.IP, avg + \" ms\", \"Online\"));
            }
            else
            {
                Console.ForegroundColor = ConsoleColor.DarkGray;
                Console.WriteLine(string.Format(\"{0,-24} {1,-16} {2,-12} {3}\", r.Name, r.IP, \"TIMEOUT\", \"Unreachable\"));
            }
            Console.ResetColor();
        }

        Console.WriteLine(new string('-', 66));
        Console.WriteLine();
        Console.ForegroundColor = ConsoleColor.Green;
        Console.WriteLine(\"🏆 FASTEST RESOLVER: \" + fastestName + \" (\" + lowestPing + \" ms)\");
        Console.ResetColor();
        Console.WriteLine();
        Console.WriteLine(\"Press [1] to apply this DNS to your Windows adapter. Press any other key to exit.\");

        var key = Console.ReadKey();
        if (key.KeyChar == '1' && !string.IsNullOrEmpty(fastestIP))
        {
            string psCmd = string.Format(\"Set-DnsClientServerAddress -InterfaceAlias (Get-NetAdapter | Where-Object Status -eq Up | Select-Object -First 1).Name -ServerAddresses '{0}','{1}'; Clear-DnsClientCache; Write-Host 'DNS Applied!' -ForegroundColor Green; Start-Sleep 2\", fastestIP, fastestSecondary);
            ProcessStartInfo psi = new ProcessStartInfo(\"powershell\", \"-Command \\\"\" + psCmd + \"\\\"\");
            psi.Verb = \"runas\";
            psi.UseShellExecute = true;
            try { Process.Start(psi); } catch {}
        }
    }
}\`;
            fs.writeFileSync('DNSBenchmark.cs', code);
          "

      - name: Compile 64-bit Windows Portable Executable (x64)
        shell: cmd
        run: |
          C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /platform:x64 /optimize+ /out:release-dist\DNS-SpeedBench-v1.0-win-x64-portable.exe DNSBenchmark.cs

      - name: Compile 32-bit Windows Portable Executable (x86)
        shell: cmd
        run: |
          C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe /platform:x86 /optimize+ /out:release-dist\DNS-SpeedBench-v1.0-win-x86-portable.exe DNSBenchmark.cs

      - name: Package Standalone Batch Launchers
        shell: pwsh
        run: |
          Copy-Item "DNSBenchmark.cs" -Destination "release-dist\DNSBenchmark-Source.cs"
          
          # Generate Standalone Double-Click Batch Runners
          $bat64 = @"
          @echo off
          title DNS SpeedBench v1.0 [64-bit Portable] - Rohith Varma
          if exist "DNS-SpeedBench-v1.0-win-x64-portable.exe" (
              start "" "DNS-SpeedBench-v1.0-win-x64-portable.exe"
          ) else (
              C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /platform:x64 /optimize+ /out:DNS-SpeedBench-v1.0-win-x64-portable.exe DNSBenchmark-Source.cs
              start "" "DNS-SpeedBench-v1.0-win-x64-portable.exe"
          )
          "@
          Set-Content -Path "release-dist\DNS-SpeedBench-v1.0-x64-Launcher.bat" -Value $bat64

          $bat32 = @"
          @echo off
          title DNS SpeedBench v1.0 [32-bit Portable] - Rohith Varma
          if exist "DNS-SpeedBench-v1.0-win-x86-portable.exe" (
              start "" "DNS-SpeedBench-v1.0-win-x86-portable.exe"
          ) else (
              C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe /platform:x86 /optimize+ /out:DNS-SpeedBench-v1.0-win-x86-portable.exe DNSBenchmark-Source.cs
              start "" "DNS-SpeedBench-v1.0-win-x86-portable.exe"
          )
          "@
          Set-Content -Path "release-dist\DNS-SpeedBench-v1.0-x86-Launcher.bat" -Value $bat32

      - name: Generate SHA-256 Checksums
        shell: pwsh
        working-directory: release-dist
        run: |
          Get-ChildItem -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash
            "$hash  $($_.Name)"
          } | Out-File -FilePath SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt

      - name: Publish GitHub Release v1.0
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: DNS SpeedBench v1.0 (Portable Windows)
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_v1.0.md
          draft: false
          prerelease: false
          files: |
            release-dist/DNS-SpeedBench-v1.0-win-x64-portable.exe
            release-dist/DNS-SpeedBench-v1.0-win-x86-portable.exe
            release-dist/DNS-SpeedBench-v1.0-x64-Launcher.bat
            release-dist/DNS-SpeedBench-v1.0-x86-Launcher.bat
            release-dist/DNSBenchmark-Source.cs
            release-dist/SHA256SUMS.txt
