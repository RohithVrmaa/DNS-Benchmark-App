<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="modalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace; }
    .sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Outer Window -->
  <rect x="20" y="20" width="1240" height="680" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Native Title Bar -->
  <path d="M 20 32 Q 20 20 32 20 L 1248 20 Q 1260 20 1260 32 L 1260 62 L 20 62 Z" fill="#0b1120" />
  <line x1="20" y1="62" x2="1260" y2="62" stroke="#1e293b" stroke-width="1" />
  <rect x="36" y="32" width="18" height="18" rx="4" fill="url(#accentCyan)" />
  <path d="M 40 41 L 44 45 L 50 36" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="64" y="45" fill="#e2e8f0" font-size="13" font-weight="600" class="sans">DNS SpeedBench v1.0 — Windows Network Adapter Tuner</text>
  <text x="560" y="45" fill="#64748b" font-size="12" class="sans">Author: Rohith Varma</text>
  <!-- Window Controls -->
  <line x1="1145" y1="42" x2="1157" y2="42" stroke="#94a3b8" stroke-width="1.5" />
  <rect x="1185" y="36" width="11" height="11" fill="none" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="1225" y1="36" x2="1235" y2="46" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="1235" y1="36" x2="1225" y2="46" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Backdrop Dimmer with Active Modal In Focus -->
  <rect x="20" y="62" width="1240" height="638" fill="#000000" fill-opacity="0.45" />

  <!-- Adapter Configurator Modal Box -->
  <g transform="translate(260, 95)" filter="url(#modalShadow)">
    <rect x="0" y="0" width="760" height="545" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />

    <!-- Modal Header -->
    <path d="M 0 14 Q 0 0 14 0 L 746 0 Q 760 0 760 14 L 760 60 L 0 60 Z" fill="#162032" />
    <line x1="0" y1="60" x2="760" y2="60" stroke="#1e293b" stroke-width="1" />
    <rect x="24" y="16" width="28" height="28" rx="6" fill="#0284c7" />
    <!-- Gear/Adapter icon -->
    <circle cx="38" cy="30" r="7" fill="none" stroke="#ffffff" stroke-width="2" />
    <text x="64" y="35" fill="#ffffff" font-size="17" font-weight="700" class="sans">Apply DNS to Windows Network Adapter</text>
    <circle cx="730" cy="30" r="12" fill="#1e293b" />
    <text x="726" y="34" fill="#94a3b8" font-size="13" class="sans">✕</text>

    <!-- Modal Body Content -->
    <g transform="translate(32, 80)">
      <!-- Selected Resolver Banner -->
      <rect x="0" y="0" width="696" height="65" rx="8" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1" />
      <text x="20" y="26" fill="#34d399" font-size="11" font-weight="700" class="sans">TARGET HIGH-SPEED RESOLVER</text>
      <text x="20" y="48" fill="#ffffff" font-size="16" font-weight="700" class="sans">Cloudflare Public DNS</text>
      <text x="220" y="48" fill="#38bdf8" font-size="13" class="mono">Primary: 1.1.1.1  |  Secondary: 1.0.0.1</text>
      <rect x="580" y="18" width="95" height="28" rx="6" fill="#10b981" />
      <text x="594" y="37" fill="#064e3b" font-size="12" font-weight="800" class="mono">11.2 ms AVG</text>

      <!-- Target Network Adapter Selector -->
      <g transform="translate(0, 85)">
        <text x="0" y="0" fill="#cbd5e1" font-size="12" font-weight="700" class="sans">Select Target Windows Network Adapter:</text>
        <rect x="0" y="10" width="696" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="16" y="36" fill="#f8fafc" font-size="13" class="sans">Wi-Fi (Intel(R) Wi-Fi 6 AX201 160MHz)  —  [Active Connected]</text>
        <polygon points="665,30 675,30 670,38" fill="#94a3b8" />
      </g>

      <!-- Generated PowerShell / Command Script Preview Box -->
      <g transform="translate(0, 155)">
        <text x="0" y="0" fill="#cbd5e1" font-size="12" font-weight="700" class="sans">Generated Native Windows PowerShell Command:</text>
        <rect x="0" y="10" width="696" height="120" rx="6" fill="#050811" stroke="#1e293b" stroke-width="1" />
        
        <text x="16" y="35" fill="#64748b" font-size="11" class="mono"># Run as Administrator in Windows PowerShell / Terminal</text>
        <text x="16" y="55" fill="#38bdf8" font-size="12" class="mono">Set-DnsClientServerAddress -InterfaceAlias &quot;Wi-Fi&quot; `</text>
        <text x="32" y="75" fill="#34d399" font-size="12" class="mono">-ServerAddresses (&quot;1.1.1.1&quot;, &quot;1.0.0.1&quot;, &quot;2606:4700:4700::1111&quot;)</text>
        <text x="16" y="105" fill="#e2e8f0" font-size="12" class="mono">Clear-DnsClientCache; Write-Host &quot;DNS Optimization Applied!&quot; -ForegroundColor Green</text>
      </g>

      <!-- Action Buttons -->
      <g transform="translate(0, 305)">
        <!-- Download .ps1 -->
        <rect x="0" y="0" width="220" height="40" rx="8" fill="url(#accentCyan)" />
        <text x="25" y="25" fill="#ffffff" font-size="13" font-weight="700" class="sans">📥 Download .ps1 Script</text>

        <!-- Download .bat -->
        <rect x="235" y="0" width="220" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="260" y="25" fill="#cbd5e1" font-size="13" font-weight="600" class="sans">⚙ Download .bat Script</text>

        <!-- Restore / Reset DHCP -->
        <rect x="470" y="0" width="226" height="40" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1" />
        <text x="495" y="25" fill="#f87171" font-size="13" font-weight="600" class="sans">↺ Revert to ISP DHCP</text>
      </g>

      <!-- Safe & Reversible Note -->
      <g transform="translate(0, 365)">
        <text x="0" y="16" fill="#64748b" font-size="11" class="sans">🛡️ 100% Safe &amp; Fully Reversible: Restores original router DHCP DNS anytime with a single click.</text>
        <text x="0" y="32" fill="#64748b" font-size="11" class="sans">No registry hacks, no background services, no drivers installed.</text>
      </g>
    </g>
  </g>
</svg>
