      <text x="1058" y="34" fill="#cbd5e1" font-size="12" font-weight="600" class="sans">Configure Adapter</text>
    </g>

    <!-- Bottom Status / Peering Bar -->
    <g transform="translate(0, 355)">
      <rect x="0" y="0" width="1192" height="70" rx="0" fill="#0b1120" />
      <text x="24" y="25" fill="#e2e8f0" font-size="12" font-weight="700" class="sans">⚡ Instant Recommendation:</text>
      <text x="195" y="25" fill="#94a3b8" font-size="12" class="sans">Switching your primary DNS to Cloudflare (1.1.1.1) will reduce lookup latency by <tspan fill="#10b981" font-weight="700">62%</tspan> compared to default ISP gateway.</text>
      <text x="24" y="48" fill="#64748b" font-size="11" class="mono">54 / 54 Resolvers Active  •  Zero Telemetry  •  Native Win32 High-Precision Query Engine</text>
